port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50050
  use_external_ip: false
  allow_tcp_fallback: true

# 💰 FinOps: Teto de Banda do Nó (50 MB/s = 400 Mbps para comportar múltiplos streams 120 FPS)
limit:
  bytes_per_sec: 50000000

room:
  empty_timeout: 300
  departure_timeout: 20

keys:
  devkey: "secret-super-seguro-para-desenvolvimento-local-32"

logging:
  level: info

# Conexão interna para coordenação de Ingress (WHIP)
redis:
  address: redis:6379

ingress:
  whip_base_url: http://127.0.0.1:8085/w

