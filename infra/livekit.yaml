port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50050
  use_external_ip: true
  skip_external_ip_validation: true
  advertise_internal_ip: true
  enable_loopback_candidate: true
  allow_tcp_fallback: true

limit:
  bytes_per_sec: 123750000

room:
  empty_timeout: 300
  departure_timeout: 60

keys:
  livekit_api_key_placeholder: "livekit_api_secret_placeholder_minimum_32_characters"

logging:
  level: info

redis:
  address: redis:6379

ingress:
  whip_base_url: http://127.0.0.1:8085/w

webhook:
  api_key: livekit_api_key_placeholder
  urls:
    - http://frontend:3000/api/livekit/webhook